name: Latest Releases

# Weekly bumps (including majors) for <properties> versions declared with
# mvnrepository.com links (see SECURITY.md). Opens a PR when anything changes.

on:
  schedule:
    - cron: '0 6 * * 4'  # every Thursday 06:00 UTC
  workflow_dispatch:

permissions: { }

jobs:
  latest-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure push credentials
        env:
          PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token="${DEFAULT_TOKEN}"
          source="GITHUB_TOKEN"
          if [ -n "${PUSH_TOKEN:-}" ]; then
            if curl -fsS \
              -H "Authorization: Bearer ${PUSH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/user" >/dev/null; then
              token="${PUSH_TOKEN}"
              source="GH_PUSH_TOKEN"
            else
              echo "::warning::GH_PUSH_TOKEN is invalid or expired; falling back to GITHUB_TOKEN. Refresh the PAT so CI runs on the opened PR."
            fi
          else
            echo "::warning::GH_PUSH_TOKEN is not set; using GITHUB_TOKEN. PRs opened with GITHUB_TOKEN do not trigger other workflows."
          fi
          echo "PUSH_AUTH_SOURCE=${source}" >> "$GITHUB_ENV"
          {
            echo "GH_TOKEN<<EOF"
            echo "${token}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Using credentials from ${source}"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Update property versions from mvnrepository links
        run: python3 .github/scripts/update-property-versions.py --mode latest --root .

      - name: Check for changes
        id: diff
        run: |
          rm -f property-version-updates.md
          if git diff --name-only | grep -E '(^|/)pom\.xml$' >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache NVD database
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.dependency-check
          key: owasp-nvd-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-

      - name: Run OWASP check on updated dependencies
        if: steps.diff.outputs.changed == 'true'
        id: owasp
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mvn --no-transfer-progress org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            --batch-mode \
            && echo "status=✅ No HIGH+ CVEs in updated dependencies" >> "$GITHUB_OUTPUT" \
            || echo "status=⚠️ HIGH+ CVEs detected or scan incomplete — review before merging" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create PR
        if: steps.diff.outputs.changed == 'true'
        env:
          OWASP_STATUS: ${{ steps.owasp.outputs.status || '⚠️ OWASP scan skipped/timed out — review before merging' }}
        run: |
          set -euo pipefail
          BRANCH="chore/latest-releases-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          mapfile -t pom_files < <(git diff --name-only | grep -E '(^|/)pom\.xml$' || true)
          if [ "${#pom_files[@]}" -eq 0 ]; then
            echo "Nothing staged — aborting PR creation."
            exit 0
          fi
          git add -- "${pom_files[@]}"
          git commit -m "chore: bump dependency properties to latest releases $(date +%Y-%m-%d)"
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          printf '%s\n' \
            "## Latest property release upgrades" \
            "" \
            "Auto-generated by the **Latest Releases** workflow." \
            "" \
            "Scans every \`pom.xml\` \`<properties>\` entry that has a" \
            "\`https://mvnrepository.com/artifact/...\` comment link, looks up the" \
            "latest **stable** version on Maven Central, and applies updates" \
            "**including major version bumps**." \
            "" \
            "> **Note:** Major version bumps may require manual compatibility review before merging." \
            "" \
            "**Security scan:** ${OWASP_STATUS}" \
            "" \
            "**Auth:** pushed with \`${PUSH_AUTH_SOURCE}\`." \
            "" \
            "Review and merge when checks are green." \
            > /tmp/pr-body.md
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --title "chore: bump dependency properties to latest releases $(date +%Y-%m-%d)" \
              --label "dependency" \
              --label "dependencies" \
              --body-file /tmp/pr-body.md \
              --base master \
              --head "$BRANCH"
          else
            echo "PR for $BRANCH already exists — updated branch only."
          fi
          gh pr merge "$BRANCH" --auto --squash || \
            echo "Auto-merge not enabled or unavailable; PR left open for review."
