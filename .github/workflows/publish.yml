name: Publish to GitHub Packages

on:
  schedule:
    - cron: '0 12 * * 1'  # every Monday 12:00 UTC (after Dependabot / property upgrades)
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 2026.9.2) — leave blank to auto-generate'
        required: false
        type: string

permissions: { }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            echo "value=$VERSION_OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            # CalVer: YYYY.M.W — W = week-of-month (1–5) for weekly Monday publishes
            YEAR=$(date +'%Y')
            MONTH=$(date +'%-m')
            DAY=$(date +'%-d')
            WEEK=$(( (10#$DAY - 1) / 7 + 1 ))
            echo "value=${YEAR}.${MONTH}.${WEEK}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mvn --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false

      - name: Build and publish to GitHub Packages
        run: mvn --no-transfer-progress deploy -DskipTests --batch-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Generate CycloneDX SBOM
        run: |
          mvn --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -DskipTests --batch-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Create GitHub Release with SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes \
            --target "${RELEASE_SHA}" \
            target.nosync/bom.json \
            target.nosync/bom.xml

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            target.nosync/bom.json
            target.nosync/bom.xml

      - name: Open PR for version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          BRANCH="ci/release-v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No version-bump changes to commit."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ci: release v${RELEASE_VERSION} [skip ci]"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "ci: release v${RELEASE_VERSION}" \
            --body "Version bump from the Publish to GitHub Packages workflow for \`v${RELEASE_VERSION}\`." \
            --base master \
            --head "$BRANCH" \
          || echo "PR may already exist for $BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch \
            || echo "Auto-merge not available; merge the release PR manually."
