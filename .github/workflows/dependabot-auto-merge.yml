name: Auto-merge

# Dependabot autonomy: squash-merge when checks pass and delete the head branch.
# Human PRs are left for manual merge.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [master]

permissions: {}

jobs:
  auto-merge:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Enable auto-merge (Dependabot only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != 'dependabot[bot]' ] && [ "$ACTOR" != 'app/dependabot' ]; then
            echo "Skipping auto-merge for actor=$ACTOR (Dependabot only)."
            exit 0
          fi
          gh pr merge --auto --squash --delete-branch "$PR_URL" \
            && echo "Auto-merge enabled; branch will be deleted after merge." \
            || echo "Auto-merge not available (repo setting disabled or already set)."

  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "Head branch is from a fork ($HEAD_REPO) — skipping delete."
            exit 0
          fi
          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            echo "Refusing to delete protected branch '$BRANCH'."
            exit 0
          fi
          if gh api -X DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"; then
            echo "Deleted branch '$BRANCH'."
          else
            echo "Branch '$BRANCH' already deleted or not found."
          fi

  rebase-on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Rebase open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,author \
            --jq '.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot") | .number' | \
          while read -r pr; do
            gh pr comment "$pr" --body "@dependabot rebase" || true
          done
