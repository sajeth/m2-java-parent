version: 2
# Fully autonomous Dependabot maintenance for m2-java-parent.
# No reviewers/assignees — CODEOWNERS is empty so PRs are not blocked on humans.
# Auto-approve + auto-merge is handled by .github/workflows/dependabot-auto-merge.yml.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Root multi-module reactor (follows <modules> from pom.xml).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "fix"
    labels:
      - "dependencies"
    groups:
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
      maven-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # Not listed under m2-core-parent <modules>, so Dependabot won't see it via /.
  - package-ecosystem: maven
    directory: /m2-core-parent/m2-selenium-parent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
    labels:
      - "dependencies"
    groups:
      selenium-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
