version: 2
updates:
  # Keep GitHub Actions versions current (supply chain safety).
  # All action updates are grouped into one PR per week to reduce noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maven: security updates always; version PRs limited (weekly upgrades also via dependency-upgrade.yml).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
    labels:
      - "security"
      - "dependencies"
