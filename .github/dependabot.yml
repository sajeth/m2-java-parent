version: 2
# Autonomous Dependabot maintenance for m2-java-parent.
# Security updates always raise PRs; version updates are grouped weekly.
# Auto-merge + branch delete is handled by .github/workflows/dependabot-auto-merge.yml.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    rebase-strategy: auto
    open-pull-requests-limit: 20
    commit-message:
      prefix: "fix"
    labels:
      - "dependencies"
    groups:
      maven-security:
        applies-to: security-updates
        patterns:
          - "*"
      maven-patch-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
